name: Tests extract-core

on:
  push:
    branches: [ 'main' ]
  pull_request:
    paths:
      - 'extract-core/**'
env:
  PYTHON_VERSION: 3.13
  ASTRAL_VERSION: 0.11.6

jobs:
  lint-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: extract-core
      - name: Check formatting
        run: cd extract-core && uv run ruff format --check
      - name: Lint test
        run: cd extract-core && uv run ruff check

  tests-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python project
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: extract-core
      - name: Run tests
        run: |
          cd extract-core
          uv sync --verbose --frozen --dev --all-extras
          uv run --frozen python -m pytest -vvv --cache-clear --show-capture=all -r A tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true